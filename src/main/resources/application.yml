spring:
  application:
    name: x-rag-project-assistant
  # Configuration d'équipe externalisée (voir team-config.example.yml)
  config:
    import: "optional:file:${TEAM_CONFIG:./team-config.yml}"
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:xrag}
    username: ${POSTGRES_USER:xrag}
    password: ${POSTGRES_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  ai:
    # Un seul ChatModel actif à la fois ; les embeddings restent toujours Ollama (local)
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: qwen2.5:7b-instruct
      embedding:
        options:
          model: bge-m3
    vectorstore:
      pgvector:
        # Schéma géré par Liquibase, pas par Spring AI
        initialize-schema: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
# Profil gemini : LLM distant (si politique de confidentialité OK). Embeddings restent locaux.
# Spring AI 2.x : module google-genai (mode Vertex AI via project-id/location,
# ou Gemini Developer API via spring.ai.google.genai.api-key).
spring:
  config:
    activate:
      on-profile: gemini
  ai:
    model:
      chat: google-genai
    google:
      genai:
        vertex-ai: true
        project-id: ${GEMINI_PROJECT_ID:}
        location: ${GEMINI_LOCATION:europe-west1}
