# Configuration d'équipe — copier vers team-config.yml et adapter.
# Un seul fichier pilote toute l'instance : aucun nom de projet n'est codé en dur.
# Les secrets (tokens API, mots de passe) vont dans .env, JAMAIS ici.

team: equipe-passerelle

llm:
  provider: ollama              # ollama (local, confidentiel) | gemini
  model: qwen2.5:7b-instruct
  fallback-model: qwen2.5:3b    # optionnel : questions descriptives simples
  embedding-model: bge-m3       # toujours local (multilingue FR + code)
  # num-ctx : fenêtre de contexte Ollama (défaut 8192 — le défaut SERVEUR 2048-4096
  # tronquerait silencieusement le prompt RAG). Mémoire KV cache proportionnelle :
  # sur machine contrainte, voir OLLAMA_KV_CACHE_TYPE dans .env.example.
  # num-ctx: 8192
  # temperature : bas = factuel (défaut 0.1) — appliqué à TOUS les providers (Gemini
  # repartirait sinon à ~1.0 et perdrait le cadrage factuel).
  # temperature: 0.1

sources:
  confluence:
    # base-url = racine de l'API, PAS une URL de navigateur (ni /spaces, ni /pages...).
    #   Cloud       : https://votre-org.atlassian.net/wiki   (suffixe /wiki OBLIGATOIRE)
    #   Data Center : https://confluence.interne.example
    base-url: https://confluence.example.com
    spaces: [PASS, ARCHI]
  # Code + MRs par l'API GitLab (token GITLAB_TOKEN dans .env) — exclusif avec git: ci-dessous
  # (un seul des deux blocs, sinon refus au démarrage).
  gitlab:
    # base-url = racine de l'instance, SANS le chemin du groupe.
    #   SaaS : https://gitlab.com      Self-managed : https://gitlab.interne.example
    base-url: https://gitlab.example.com
    group: passerelle           # découverte automatique des repos du groupe
    branches: [main, develop]
  # ALTERNATIVE sans API GitLab (politique cyber interdisant le token, poste hors réseau) :
  # dépôts git LOCAUX du poste montés en lecture seule dans le conteneur (GIT_REPOS_DIR dans
  # .env -> /repos), lus via JGit. Code + MRs RECONSTITUÉES depuis l'historique (clés Jira des
  # commits comprises), aucun appel API. L'application ne fait JAMAIS de git fetch : la
  # fraîcheur est celle des fetch du poste (scripts/git-fetch-all.sh --sync). Même source
  # « gitlab-code » et mêmes clés de chunk que l'API : basculer ne duplique aucun chunk
  # (ré-embedding complet UNE fois, la version passe du SHA de branche à l'id de blob).
  # Le project de chaque dépôt = dernier segment de l'URL du remote (sans .git) : à déclarer
  # dans aliases: comme en mode API. Limites : pas de commentaires de revue, labels,
  # approbations ni MRs fermées sans merge ; MRs ouvertes = branches distantes non fusionnées.
  # Activer : supprimer le bloc gitlab: ci-dessus et décommenter celui-ci. Procédure : docs/RUNBOOK.md §3.
  # git:
  #   root: /repos                    # dossier DANS le conteneur (montage ${GIT_REPOS_DIR:-./repos}:/repos:ro) ;
  #                                   # GIT_REPOS_DIR (chemin hôte, lu du .env) refusé s'il est trop large :
  #                                   # /, /home[/<vous>], /root, /mnt[/c[/Users[/<vous>]]], /tmp, /opt…
  #   repos: []                       # sous-chemins relatifs à root (recommandé en prod : périmètre explicite) ;
  #                                   # vide = découverte auto profondeur 4 (root/projet … root/groupe/sous-groupe/projet),
  #                                   # clones de travail (.git) ou dépôts bare (projet.git)
  #   branches: [main, develop]       # branches cibles : code indexé + historique fouillé pour les MRs
  #   remote: origin                  # refs/remotes/<remote>/<branche> lues en priorité (fraîches après
  #                                   # fetch, sans checkout), repli refs/heads/<branche> (dépôt bare/mirror)
  #   # web-base-url: https://gitlab.example.com   # OPTIONNEL : origine web des liens (blob, MR) ;
  #                                                # défaut : déduite de l'URL du remote
  #   max-file-kb: 512                # fichiers plus gros ignorés (binaires détectés par octet nul aussi)
  #   merge-requests:
  #     from-merge-commits: true      # MRs fusionnées depuis les commits de fusion (GitLab « See merge
  #                                   # request grp/proj!153 », GitHub, Bitbucket, Azure, git natif)
  #                                   # + commits de SQUASH portant « Titre (grp/proj!153) » = MR numérotée
  #     from-linear-commits: true     # séries contiguës de commits directs partageant une clé Jira = MR
  #                                   # « synthétique » (fast-forward sans référence) ; sans clé = ignoré
  #     from-open-branches: true      # branches distantes non fusionnées = MRs OUVERTES présumées (ensemble
  #                                   # autoritaire : celles qui disparaissent sont retirées à chaque sync)
  #     open-branches-exclude: ["release/*", "renovate/*", "dependabot/*", "revert-*", "cherry-pick-*"]   # défaut
  #     jira-projects: []             # défaut : sources.jira.projects -> détection insensible à la casse
  #                                   # (pass-12) sans faux positif (SHA-256) ; vide et sans Jira = regex majuscule
  #     rescan-days: 30               # fenêtre re-balayée au-delà du curseur updated_after (fetch tardif) — upsert idempotent
  #     max-changed-files: 500        # plafond des fichiers touchés retenus par MR (arêtes MODIFIES)
  #     max-commits-listed: 50        # commits listés dans la description reconstituée
  jira:
    # base-url = racine du site, SANS /jira ni /wiki.
    #   Cloud       : https://votre-org.atlassian.net
    #   Data Center : https://jira.interne.example
    base-url: https://jira.example.com
    projects: [PASS, INFRA]

# Résolution d'entités : toutes les façons de nommer un projet/sujet -> id canonique.
# Critique pour le graphe : sans alias, les nœuds se fragmentent.
# La CLÉ devient l'id du nœud (project:<clé>) telle quelle : utiliser la forme
# normalisée (minuscules, sans séparateurs — « fpspos », pas « fps-pos ») et la
# garder identique partout. Les variantes avec séparateurs vont dans la liste.
aliases:
  fpskds: ["FPS KDS", "fps-kds", "FPSKDS"]
  fpspos: ["fps-pos", "fps-pos-service"]

# Synonymes de recherche métier↔code : élargissent la recherche de MRs par sujet
# (tool searchMergeRequests) SANS toucher au graphe — contrairement à `aliases:`, aucun
# nœud projet n'est créé. Utile en monorepo, où le terme métier de l'utilisateur diffère
# du nom technique dans le code. Correspondance à frontière de mot : « pos » retrouve
# « fps-pos » mais pas « compose ». Clé = un nom quelconque du concept, valeur = ses équivalents.
synonyms:
  pos: ["caisse", "point de vente"]   # « caisse » retrouve aussi les MRs qui disent « pos »/« fps-pos »
  kds: ["cuisine", "kitchen"]

# Réglages du retrieval injecté au prompt (défauts calibrés pour num_ctx=8192).
# chunk-limit : nombre de chunks montrés au LLM ; chunk-excerpt-chars : longueur max
# d'un extrait (1800 = chunk entier). Repli si latence CPU dégradée : 6 / 1600.
retrieval:
  chunk-limit: 8
  chunk-excerpt-chars: 1800
  # Reranker cross-encoder ONNX in-process (bge-reranker-v2-m3 int8, ~571 Mo) : reclasse
  # ~40 candidats en chunk-limit sur CPU (+3-8 s/question sur la cible). Modèle téléchargé
  # par bootstrap.sh dans le volume reranker-models. Désactivé par défaut.
  reranker:
    enabled: false
    # model-path: /models/reranker
    # candidates: 40
    # max-length: 512

# Éval du retrieval (recall@k, sans LLM — rapide et objectif) : pour chaque question
# canonique, « expected » est une sous-chaîne (insensible à la casse) du path ou du titre
# de la source attendue. Rapport via GET /api/admin/eval et dans la notification nocturne.
# Prérequis pour calibrer les poids de la recherche hybride et mesurer un reranker.
eval:
  cases:
    - { question: "Comment déployer l'application ?", expected: "guide-deploiement" }
    - { question: "Y a-t-il un ticket sur le bug de persistance ?", expected: "PASS-42" }

schedule:
  nightly: "0 0 2 * * *"        # cron Spring (6 champs) — batch nocturne 02:00

extractors:
  java: true
  typescript: true
  python: false
  # Enrichissement LLM nocturne du graphe (décision d'architecture n°10) : à n'activer
  # que si l'éval de qualité signale < 50% de chunks rattachés (« Trous détectés » dans
  # le rapport du batch). Le LLM crée des nœuds TOPIC pour les documents non couverts par
  # les extracteurs déterministes, refermant le pont RAG↔graphe. Coûteux : plafonné/nuit.
  llm: false
  # llm-max-docs-per-night: 150   # plafond de docs topic-enrichis par nuit (budget batch)
