# Configuration d'équipe — copier vers team-config.yml et adapter.
# Un seul fichier pilote toute l'instance : aucun nom de projet n'est codé en dur.
# Les secrets (tokens API, mots de passe) vont dans .env, JAMAIS ici.

team: equipe-passerelle

llm:
  provider: ollama              # ollama (local, confidentiel) | gemini | openai-compatible
  model: qwen2.5:7b-instruct
  fallback-model: qwen2.5:3b    # optionnel : questions descriptives simples
  embedding-model: bge-m3       # toujours local (multilingue FR + code)

sources:
  confluence:
    # base-url = racine de l'API, PAS une URL de navigateur (ni /spaces, ni /pages...).
    #   Cloud       : https://votre-org.atlassian.net/wiki   (suffixe /wiki OBLIGATOIRE)
    #   Data Center : https://confluence.interne.example
    base-url: https://confluence.example.com
    spaces: [PASS, ARCHI]
  gitlab:
    # base-url = racine de l'instance, SANS le chemin du groupe.
    #   SaaS : https://gitlab.com      Self-managed : https://gitlab.interne.example
    base-url: https://gitlab.example.com
    group: passerelle           # découverte automatique des repos du groupe
    branches: [main, develop]
  jira:
    # base-url = racine du site, SANS /jira ni /wiki.
    #   Cloud       : https://votre-org.atlassian.net
    #   Data Center : https://jira.interne.example
    base-url: https://jira.example.com
    projects: [PASS, INFRA]

# Résolution d'entités : toutes les façons de nommer un projet/sujet -> id canonique.
# Critique pour le graphe : sans alias, les nœuds se fragmentent.
aliases:
  easyloc: ["Easy Loc", "easy-loc", "EASYLOC"]
  epsilon: ["Epsilon", "epsilon-service"]

# Synonymes de recherche métier↔code : élargissent la recherche de MRs par sujet
# (tool searchMergeRequests) SANS toucher au graphe — contrairement à `aliases:`, aucun
# nœud projet n'est créé. Utile en monorepo, où le terme métier de l'utilisateur diffère
# du nom technique dans le code. Correspondance à frontière de mot : « pos » retrouve
# « fps-pos » mais pas « compose ». Clé = un nom quelconque du concept, valeur = ses équivalents.
synonyms:
  pos: ["caisse", "point de vente"]   # « caisse » retrouve aussi les MRs qui disent « pos »/« fps-pos »
  kds: ["cuisine", "kitchen"]

schedule:
  nightly: "0 0 2 * * *"        # cron Spring (6 champs) — batch nocturne 02:00

extractors:
  java: true
  typescript: true
  python: false
