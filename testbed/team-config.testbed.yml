# Configuration d'instance pour le testbed — copier vers team-config.yml et
# adapter les base-url. Secrets (tokens) dans .env, jamais ici.

team: sandbox

llm:
  provider: ollama
  model: qwen2.5:7b-instruct
  fallback-model: qwen2.5:3b
  embedding-model: bge-m3

sources:
  confluence:
    base-url: https://confluence.example.com
    # L'indexation se fait PAR SPACE ENTIER : utilisez un space isolé où vous
    # pouvez écrire (recommandé : votre space personnel "~login"). Les pages du
    # testbed y sont créées sous la page parente « XRAG-SANDBOX ».
    spaces: ["~votre-login"]
  gitlab:
    base-url: https://gitlab.example.com
    group: passerelle/x-rag-sandbox             # créé par setup-gitlab.sh init
    branches: [main]
  jira:
    base-url: https://jira.example.com         # projet factice — voir testbed/jira/
    projects: [XRAGSAND]

# La table d'alias est un objet de test à part entière (voir scenario.md §2 :
# « Fake Ordres » est volontairement ABSENT au départ).
aliases:
  fakeorders: ["Fake Orders", "fake-orders", "FAKEORDERS"]
  fakebilling: ["Fake Billing", "fake-billing"]
  fakefront: ["Fake Front", "fake-front"]

schedule:
  nightly: "0 0 2 * * *"

extractors:
  java: true
  typescript: true
  python: false
