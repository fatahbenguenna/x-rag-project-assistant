services:
  # Ollama EN CONTENEUR (portable, CPU). Optionnel : activé par le profil « ollama-docker ».
  #   - Docker (défaut portable)   : COMPOSE_PROFILES=ollama-docker (voir .env) — l'API cible http://ollama:11434
  #   - Ollama natif hôte (GPU) ou WSL : ne PAS activer ce profil + OLLAMA_BASE_URL=http://host.docker.internal:11434
  # Ainsi un seul .env choisit le mode, sans éditer ce fichier ni conflit de port 11434.
  ollama:
    image: ollama/ollama:latest
    container_name: xrag-ollama
    profiles: ["ollama-docker"]
    volumes:
      - ollama-models:/root/.ollama
      # CA racine d'entreprise (proxy avec interception TLS) — voir CORPORATE_CA
      # dans .env.example ; défaut /dev/null = sans effet.
      - ${CORPORATE_CA:-/dev/null}:/etc/ssl/certs/corporate-ca.pem:ro
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
      # Proxy d'entreprise pour le téléchargement des modèles (ollama pull) —
      # Ollama honore ces variables ; vide = accès direct. Voir .env.example.
      HTTP_PROXY: ${PROXY_URL:-}
      HTTPS_PROXY: ${PROXY_URL:-}
      NO_PROXY: ${NO_PROXY_URL:-localhost,127.0.0.1,0.0.0.0}
    ports:
      - "11434:11434"
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: xrag-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xrag}
      POSTGRES_USER: ${POSTGRES_USER:-xrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis (voir .env.example)}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xrag} -d ${POSTGRES_DB:-xrag}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rag-api:
    # Image versionnée du registry (docker compose pull) ; le build local reste
    # disponible pour le développement (docker compose build).
    # Poste derrière un proxy d'entreprise : voir MAVEN_OPTS / BUILD_NETWORK dans
    # .env.example si le build échoue en « Network is unreachable » sur Maven Central.
    build:
      context: .
      network: ${BUILD_NETWORK:-default}
      args:
        MAVEN_OPTS: ${MAVEN_OPTS:-}
      secrets:
        - maven-settings
    image: ${RAG_API_IMAGE:-xrag/rag-api:local}
    container_name: xrag-api
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      # Où l'API trouve Ollama. Défaut = conteneur (profil ollama-docker). Pour un Ollama
      # natif hôte (Mac GPU Metal / Windows) ou WSL : OLLAMA_BASE_URL=http://host.docker.internal:11434
      # dans .env (voir .env.example). host.docker.internal résout l'hôte grâce à extra_hosts.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      TEAM_CONFIG: /config/team-config.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./team-config.yml:/config/team-config.yml:ro
      # Modèle du reranker cross-encoder (optionnel — retrieval.reranker.enabled) :
      # rempli par bootstrap.sh, comme les modèles Ollama vivent dans leur volume.
      - reranker-models:/models/reranker
    ports:
      - "8080:8080"
    # Pas de depends_on ollama : le conteneur Ollama est optionnel (profil), et en mode
    # natif/WSL il n'existe pas. L'API se connecte à Ollama à la première requête.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # UI optionnelle : docker compose --profile ui up -d
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: xrag-webui
    profiles: ["ui"]
    environment:
      OPENAI_API_BASE_URL: http://rag-api:8080/v1
      WEBUI_AUTH: "false"
    volumes:
      - webui-data:/app/backend/data
    ports:
      - "3000:8080"
    depends_on:
      - rag-api
    restart: unless-stopped

volumes:
  ollama-models:
  reranker-models:
  pg-data:
  webui-data:

secrets:
  # settings.xml Maven pour le build (miroir/token d'entreprise). Défaut : placeholder
  # neutre commité ; pointer MAVEN_SETTINGS (.env) vers le vrai fichier si besoin.
  maven-settings:
    file: ${MAVEN_SETTINGS:-./.maven-settings.xml}
