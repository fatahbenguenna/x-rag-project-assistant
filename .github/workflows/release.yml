name: release

# Publication d'images versionnées (exportabilité, CLAUDE.md) : les équipes
# consomment ensuite `docker compose pull && docker compose up -d`.
#
# Registry par défaut : GHCR (aucun secret à créer, GITHUB_TOKEN suffit).
# Registry privé (self-hosted + Tailscale) : définir les secrets
# REGISTRY_URL, REGISTRY_USERNAME, REGISTRY_PASSWORD — le workflow bascule
# automatiquement dessus.

on:
  push:
    tags: ["v*"]

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Choisir le registry
        id: registry
        run: |
          if [ -n "${{ secrets.REGISTRY_URL }}" ]; then
            echo "registry=${{ secrets.REGISTRY_URL }}" >> "$GITHUB_OUTPUT"
            echo "username=${{ secrets.REGISTRY_USERNAME }}" >> "$GITHUB_OUTPUT"
            echo "use_private=true" >> "$GITHUB_OUTPUT"
          else
            echo "registry=ghcr.io" >> "$GITHUB_OUTPUT"
            echo "username=${{ github.actor }}" >> "$GITHUB_OUTPUT"
            echo "use_private=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.registry }}
          username: ${{ steps.registry.outputs.username }}
          password: ${{ steps.registry.outputs.use_private == 'true' && secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.registry.outputs.registry }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
